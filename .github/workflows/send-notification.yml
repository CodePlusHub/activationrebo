name: Notify Gmail from Commit

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extract commit message
        id: extract
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:%s)
          echo "Commit message: $COMMIT_MSG"
          EMAIL=$(echo "$COMMIT_MSG" | grep -oP 'notify[:=]\s*\K[^\s]+')
          echo "Found email: $EMAIL"
          echo "email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Send GET to Google Apps Script
        if: steps.extract.outputs.email != ''
        run: |
          curl -G "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec" \
            --data-urlencode "email=${{ steps.extract.outputs.email }}" \
            --data-urlencode "commit_message=notify:${{ steps.extract.outputs.email }}"
