name: Notify Gmail from Commit

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extract commit message
        id: extract
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:%s)
          echo "Commit message: $COMMIT_MSG"
          EMAIL=$(echo "$COMMIT_MSG" | grep -oP 'notify[:=]\s*\K[^\s]+')
          echo "Found email: $EMAIL"
          echo "email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Send POST to Google Apps Script
        if: steps.extract.outputs.email != ''
        run: |
          curl -X POST https://script.google.com/macros/s/AKfycbzfp3Lu2p4eBjCQAPIvext_VCstvvIRe36PK7TW2waeSpqK-6DGlO1I8gLbbCOYxYpl/exec \
            -H "Content-Type: application/json" \
            -d "{\"deployment_status\": \"success\", \"deployment_trigger\": {\"metadata\": {\"commit_message\": \"notify:$EMAIL\"}}}"
